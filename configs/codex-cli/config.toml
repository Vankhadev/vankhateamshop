model_provider = "TiemAI"
model = "gpt-5.6-sol"
disable_response_storage = true

[model_providers.TiemAI]
name = "TiemAI Gateway"
base_url = "https://tiemai.io.vn/v1"
wire_api = "responses"
requires_openai_auth = true
